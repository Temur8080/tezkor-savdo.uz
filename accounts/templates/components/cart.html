<div id="joriy-cart" class="w-full shrink-0 flex flex-col min-h-0 h-full bg-sky-50 border border-sky-200 rounded-lg shadow-sm overflow-hidden">

                <p class="text-xs text-sky-700/80 mt-0.5">Mijoz: Oddiy mijoz</p>
            </div>
            <div class="flex flex-wrap items-center gap-1.5 shrink-0">
                <div class="relative" id="reserve-btn-wrap">

                        Bronlash

                    <button type="button" id="reserve-count-badge"

                    <div id="reserved-orders-dropdown"
                         class="hidden absolute right-0 top-full mt-2 w-72 max-w-[85vw] z-30 bg-white border border-amber-300 rounded-lg shadow-lg p-2">
                        <div class="flex items-center justify-between gap-2 px-1 pb-2 mb-1 border-b border-amber-100">
                            <p class="text-[10px] font-semibold uppercase tracking-wide text-amber-800">Bronlar</p>
                            <a href="{% url 'reservations_list' %}" class="text-[10px] font-semibold text-amber-700 hover:underline">Barchasi →</a>
                        </div>
                        <div id="reserved-orders-list" class="space-y-2 max-h-56 overflow-y-auto"></div>
                    </div>
                </div>
                <button type="button" id="hold-order-btn"

                    Zahiralash

            </div>
        </div>

        <div id="held-orders-panel" class="mt-3 hidden">
            <div class="flex items-center justify-between gap-2 mb-2">

                    Zahiralangan

                </p>

            <div id="held-orders-list" class="space-y-2 max-h-28 overflow-y-auto"></div>
        </div>
    </div>

    <div id="cart-items" class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden overscroll-contain p-3 space-y-2 bg-sky-50/70">
    </div>

    <div class="cart-foot p-3 sm:p-4 bg-sky-100/90 border-t border-sky-200 shrink-0 space-y-3">
        <div id="total-container" class="space-y-1"></div>

        <button id="checkout-btn"
                class="w-full bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white py-3.5 rounded-md text-base sm:text-sm font-semibold shadow-sm transition flex items-center justify-center gap-2 touch-manipulation">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
