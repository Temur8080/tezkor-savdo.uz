{% load money_tags %}
<div class="h-full min-h-0 flex flex-col bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">

    <form method="get" class="flex flex-wrap items-end justify-between gap-3 p-4 bg-gray-50 border-b border-gray-200 shrink-0">
        <div class="min-w-0">
            <h1 class="text-xl font-bold text-gray-900">Kassa terminali</h1>
            <p class="text-sm text-gray-500 mt-0.5">Mahsulotni tanlang yoki skaner bilan qo‘shing.</p>
        </div>
        <div class="flex flex-row items-end gap-2 flex-grow sm:flex-grow-0 sm:min-w-[280px] max-w-xl w-full sm:w-auto">
            <div class="flex flex-col flex-grow min-w-0">
                <label class="text-xs font-semibold text-gray-600 mb-1">Qidiruv</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 pointer-events-none">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </span>
                    <input name="q" type="search" enterkeyhint="search"
                           value="{{ request.GET.q|default:'' }}"
                           placeholder="Nomi, shtrix-kod yoki SKU..."
                           class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                </div>
            </div>
            <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 transition shrink-0">
                Qidirish
            </button>
            {% if request.GET.q %}
            <a href="{% url 'pos_terminal' %}"
               class="px-4 py-2 bg-gray-200 text-gray-700 text-sm rounded-md hover:bg-gray-300 transition shrink-0">
                Tozalash
            </a>
            {% endif %}
        </div>
    </form>

    <div class="relative flex-1 min-h-0 overflow-hidden bg-gray-50">
        <div id="inventory-grid" class="h-full overflow-y-auto overflow-x-auto overscroll-contain p-3
                    grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3 content-start">
            {% for item in branch_products %}
            <button type="button"
                    class="product-card group bg-white border border-gray-200 p-3 rounded-md
                           hover:border-blue-500 hover:shadow-sm transition text-left flex flex-col
                           disabled:opacity-45 disabled:cursor-not-allowed touch-manipulation"
                    data-barcode="{{ item.product.barcode }}"
                    data-id="{{ item.product.id }}"
                    data-name="{{ item.product.product_name }}"
                    data-price="{{ item.product.base_price }}"
                    data-currency="{{ item.product.currency }}"
                    data-category="{{ item.product.get_category_display }}"
                    data-image="{% if item.product.image %}{{ item.product.image.url }}{% endif %}"
                    data-stock="{{ item.quantity }}"
                    {% if item.quantity <= 0 %}disabled{% endif %}>
                <div class="h-24 sm:h-28 w-full bg-gray-50 border border-gray-100 rounded-md mb-2 sm:mb-3 flex items-center justify-center overflow-hidden">
                    {% if item.product.image %}
                        <img src="{{ item.product.image.url }}"
                             alt="{{ item.product.product_name }}"
                             class="h-full w-full object-cover"
                             loading="lazy"
                             onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('beforeend','<span class=\'text-gray-300 text-xs font-semibold\'>Rasm yo‘q</span>');">
                    {% else %}
                        <span class="text-gray-300 text-xs font-semibold">Rasm yo‘q</span>
                    {% endif %}
                </div>
                <h3 class="text-sm font-semibold text-gray-900 leading-tight truncate">{{ item.product.product_name }}</h3>
                <div class="mt-auto pt-2 flex items-center justify-between gap-2">
                    <span class="text-sm font-bold text-blue-700">{{ item.product.base_price|money:item.product.currency }}</span>
                    <span class="text-[10px] font-semibold uppercase {% if item.quantity > 0 %}text-emerald-600{% else %}text-red-600{% endif %}">
                        {{ item.quantity }} dona
                    </span>
                </div>
            </button>
            {% empty %}
            <div class="col-span-full py-16 text-center text-sm text-gray-500">
                Mahsulot topilmadi
            </div>
            {% endfor %}
        </div>

        <div id="product-container" class="hidden absolute inset-0 z-20 flex items-center justify-center bg-white/90 backdrop-blur-sm p-4">
            <div id="focus-card-target" class="w-full max-w-xl transform transition-all duration-300"></div>
        </div>
    </div>
</div>
