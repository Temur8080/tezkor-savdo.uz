{% csrf_token %}

<div id="cash-modal" class="hidden relative w-full max-w-4xl max-h-[100dvh] sm:max-h-[92vh]
            bg-white border border-gray-200 rounded-t-2xl sm:rounded-lg shadow-lg
            overflow-x-auto overflow-y-hidden flex flex-col md:flex-row">

    <button type="button" onclick="closeCheckoutModal()"
            class="absolute top-3 right-3 z-20 p-2.5 rounded-full text-gray-500 hover:text-gray-800 hover:bg-gray-100 transition bg-white/90 shadow-sm"
            aria-label="Yopish">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>

    <div class="cash-modal-left w-full md:w-[58%] min-w-[280px] border-b md:border-b-0 md:border-r border-gray-200 overflow-y-auto overflow-x-auto overscroll-contain">
        <div class="p-4 bg-gray-50 border-b border-gray-200 pr-14">
            <h3 id="cash-modal-title" class="text-lg font-bold text-gray-900">Naqd to‘lov</h3>
            <p id="cash-modal-subtitle" class="text-sm text-gray-500 mt-0.5">Mijoz ma’lumotlari va qabul qilingan summa</p>
        </div>

        <div class="p-4 space-y-4 pb-6">
            <input type="hidden" id="cash-cust-type" value="regular">
            <input type="hidden" id="cash-partner-id" value="">

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Mijoz ismi</label>
                    <input type="text" id="cash-cust-name"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500 outline-none"
                           placeholder="Oddiy mijoz">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Telefon</label>
                    <input type="text" id="cash-cust-phone" name="phone"
                           class="phone-uz w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500 outline-none"
                           placeholder="+998 XX XXX XX XX" autocomplete="tel" inputmode="tel" value="+998">
                    <p id="cash-cust-lookup-hint" class="mt-1 text-[11px] text-gray-400 hidden"></p>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Manzil</label>
                    <input type="text" id="cash-cust-address"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500 outline-none"
                           placeholder="Mahalla, shahar">
                </div>
            </div>

            <div id="cash-currency-picker" class="hidden">
                <label class="block text-xs font-semibold text-gray-600 mb-1">To‘lov valyutasi</label>
                <div class="flex gap-2">
                    <button type="button" id="cash-currency-uzs"
                            class="flex-1 py-2 rounded-md text-sm font-semibold bg-blue-600 text-white touch-manipulation">So‘m</button>
                    <button type="button" id="cash-currency-usd"
                            class="flex-1 py-2 rounded-md text-sm font-semibold bg-gray-100 text-gray-600 touch-manipulation">Dollar</button>
                </div>
            </div>

            <div id="cash-pay-block" class="border border-gray-200 rounded-md p-4 bg-gray-50">
                <label class="block text-xs font-semibold text-gray-600 mb-1">Qabul qilingan naqd</label>
                <div class="flex items-center gap-2">
                    <span id="cash-currency-label" class="text-sm font-bold text-emerald-700 shrink-0">so‘m</span>
                    <input type="text" id="cash-received-input" inputmode="decimal" autocomplete="off"
                           oninput="onCashReceivedInput()"
                           class="w-full bg-white border border-gray-300 rounded-md px-3 py-2 text-2xl font-bold text-gray-900 outline-none focus:ring-blue-500 focus:border-blue-500"
                           placeholder="0">
                </div>
                <div class="flex justify-between items-center mt-4 pt-3 border-t border-gray-200">
                    <span id="change-label" class="text-xs font-semibold text-gray-500 uppercase">Qaytim</span>
                    <span id="change-display" class="text-xl font-bold text-emerald-700">0 so‘m</span>
                </div>
                <p id="debt-hint" class="hidden mt-2 text-xs font-semibold text-amber-700">
                    Kam to‘lov — mijoz ismi va telefon to‘ldirilsa, farq qarzdorlar ro‘yxatiga yoziladi.
                </p>
            </div>
        </div>
    </div>

    <div class="cash-modal-right w-full md:w-[42%] min-w-[260px] flex flex-col bg-white min-h-0 shrink-0">
        <div class="p-4 bg-gray-50 border-b border-gray-200">
            <h4 class="text-base font-bold text-gray-900">Mahsulotlar</h4>
            <p class="text-xs text-gray-500 mt-0.5">Tanlangan valyutadagi savat</p>
        </div>

        <div id="cash-modal-image" class="flex-grow space-y-2 overflow-y-auto overflow-x-auto max-h-[28vh] md:max-h-[320px] p-4 overscroll-contain">
        </div>

        <div class="p-4 border-t border-gray-200 bg-gray-50 mt-auto sticky bottom-0 pb-safe">
            <div id="cash-list-row" class="hidden flex justify-between items-center mb-1">
                <span class="text-xs text-gray-500">Asl narx</span>
                <span id="cash-list-price" class="text-sm text-gray-500 line-through">0</span>
            </div>
            <div id="cash-save-row" class="hidden flex justify-between items-center mb-2">
                <span id="cash-save-label" class="text-xs font-semibold text-emerald-600">Chegirma</span>
                <span id="cash-save-amount" class="text-sm font-bold text-emerald-700">0</span>
            </div>
            <div class="flex justify-between items-end mb-3">
                <span class="text-xs font-semibold text-gray-500 uppercase">Umumiy summa</span>
                <span id="cash-modal-price" class="text-2xl font-bold text-gray-900">0 so‘m</span>
            </div>
            <button type="button" id="place-order-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3.5 rounded-md text-base sm:text-sm transition shadow-sm touch-manipulation">
                <span id="place-order-btn-label">Buyurtmani tasdiqlash</span>
            </button>
        </div>
    </div>
</div>
