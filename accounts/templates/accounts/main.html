{% load static %}
<!doctype html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f766e">
    <script>
        window.TEZKOR_THEME = {
            mode: "{{ theme_settings.mode|default:'system'|escapejs }}",
            dayStart: {{ theme_settings.day_start|default:6 }},
            nightStart: {{ theme_settings.night_start|default:19 }}
        };
        (function () {
            var cfg = window.TEZKOR_THEME || {};
            var mode = (cfg.mode || 'system').toLowerCase();
            var dayStart = Number(cfg.dayStart); if (!(dayStart >= 0 && dayStart <= 23)) dayStart = 6;
            var nightStart = Number(cfg.nightStart); if (!(nightStart >= 0 && nightStart <= 23)) nightStart = 19;
            var dark = false;
            if (mode === 'night') dark = true;
            else if (mode === 'day') dark = false;
            else if (mode === 'auto') {
                var h = new Date().getHours();
                dark = h >= nightStart || h < dayStart;
            } else {
                try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { dark = false; }
            }
            if (dark) {
                document.documentElement.classList.add('dark');
                document.documentElement.style.colorScheme = 'dark';
                document.documentElement.setAttribute('data-theme', 'night');
            } else {
                document.documentElement.setAttribute('data-theme', 'day');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <link href="{% static 'css/theme.css' %}?v=6" rel="stylesheet" />
    <title>{{ brand.brand_name|default:"Tezkor" }} Kassa</title>

    <style>
        html { font-size: 0.95rem; }
        @media (max-width: 640px) {
            html { font-size: 1rem; }
        }
    </style>

    <meta name="google-site-verification" content="wcSZfhKOaNMLGXfdHpFv9cGL_-qxAdySYVS6e6wyB8M" />
</head>
<body>

    {% include 'accounts/navbar.html' %}

    <main class="page-main pt-20 sm:pt-24 px-3 sm:px-6 pb-6 sm:pb-8">
        {% block content %}

        {% endblock %}
    </main>

    {# Global skaner: har qanday bo‘limda Terminal / Ombor tanlovi #}
    <div id="global-scan-modal"
         class="hidden fixed inset-0 z-[200] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/45 backdrop-blur-[2px]"
         aria-hidden="true"
         role="dialog"
         aria-labelledby="gscan-name">
        <div class="w-full max-w-lg rounded-t-2xl sm:rounded-2xl bg-white shadow-2xl border border-slate-200/80 overflow-hidden">
            <div class="px-5 pt-5 pb-4 bg-gradient-to-br from-sky-50 via-white to-emerald-50 border-b border-slate-100">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">Skaner</p>
                        <div class="flex items-center gap-2 flex-wrap">
                            <h2 id="gscan-name" class="text-lg font-bold text-slate-900 truncate">Mahsulot</h2>
                            <span id="gscan-badge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">—</span>
                        </div>
                        <p id="gscan-meta" class="mt-1 text-sm text-slate-600"></p>
                        <p class="mt-2 text-xs font-mono text-slate-500">Kod: <span id="gscan-barcode"></span></p>
                    </div>
                    <button type="button" id="gscan-close"
                            class="shrink-0 w-9 h-9 rounded-full text-slate-500 hover:bg-slate-100 hover:text-slate-800 text-xl leading-none"
                            aria-label="Yopish">&times;</button>
                </div>
                <img id="gscan-img" alt="" class="hidden mt-3 h-20 w-20 object-cover rounded-xl border border-slate-200 bg-white">
            </div>
            <div class="p-4 grid grid-cols-2 gap-3">
                <button type="button" id="gscan-terminal"
                        class="group flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-sky-200 bg-sky-50/80 px-3 py-5
                               hover:border-sky-400 hover:bg-sky-100 transition focus:outline-none focus:ring-2 focus:ring-sky-400">
                    <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-sky-600 text-white shadow-sm group-hover:scale-105 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 7V6a2 2 0 012-2h2a2 2 0 012 2v1m-8 0h10a2 2 0 012 2v8a2 2 0 01-2 2H7a2 2 0 01-2-2V9a2 2 0 012-2zm3 5h4" />
                        </svg>
                    </span>
                    <span class="text-base font-bold text-sky-900">Terminal</span>
                    <span class="text-[11px] text-sky-700/80 text-center leading-tight">Kassaga qo‘shish</span>
                </button>
                <button type="button" id="gscan-ombor"
                        class="group flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-emerald-200 bg-emerald-50/80 px-3 py-5
                               hover:border-emerald-400 hover:bg-emerald-100 transition focus:outline-none focus:ring-2 focus:ring-emerald-400">
                    <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-600 text-white shadow-sm group-hover:scale-105 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                        </svg>
                    </span>
                    <span class="text-base font-bold text-emerald-900">Ombor</span>
                    <span class="text-[11px] text-emerald-700/80 text-center leading-tight">Kirim / yangilash</span>
                </button>
            </div>
        </div>
    </div>

    <script src="{% static 'js/themeAuto.js' %}?v=4"></script>
    <script src="{% static 'js/moneyFormat.js' %}?v=2"></script>
    <script src="{% static 'js/phoneUz.js' %}?v=2"></script>
    <script src="{% static 'js/globalScanner.js' %}?v=3"></script>

</body>
</html>
